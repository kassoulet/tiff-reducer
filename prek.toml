# Prek configuration file
# Pre-commit hooks written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  {
    id = "check-added-large-files",
    args = ["--maxkb=1024"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-check",
    name = "Cargo Check",
    # Compiling hooks run through scripts/prek-env.sh, which selects a consistent
    # rustup `stable` toolchain and a hook-private target dir. This works around a
    # distro rust package whose rustc/clippy-driver have mismatched version
    # metadata (cargo clippy -> E0514). See that script for details.
    entry = "./scripts/prek-env.sh cargo check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-clippy",
    name = "Cargo Clippy",
    entry = "./scripts/prek-env.sh cargo clippy -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-fmt",
    name = "Cargo Format",
    entry = "cargo fmt -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-test",
    name = "Cargo Test (All Tests + Report)",
    entry = "./scripts/prek-env.sh ./scripts/run-tests.sh",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  }
]
