# Prek configuration file
# Pre-commit hooks written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  {
    id = "check-added-large-files",
    args = ["--maxkb=1024"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-check",
    name = "Cargo Check",
    entry = "cargo check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-clippy",
    name = "Cargo Clippy",
    entry = "cargo clippy -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-fmt",
    name = "Cargo Format",
    entry = "cargo fmt -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true
  },
  {
    id = "cargo-test",
    name = "Cargo Test (All Tests + Report)",
    entry = "bash -c 'cargo test --test integration_tests && python3 tests/generate_test_report.py'",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
  {
    id = "black",
    name = "Black (Python Formatter)",
    entry = "black",
    language = "python",
    types = ["python"],
    args = [
      "--check",
      "--diff"
    ],
    require_serial = true,
    additional_dependencies = ["black>=24.0.0"]
  },
  {
    id = "pylint",
    name = "Pylint",
    entry = "pylint",
    language = "python",
    types = ["python"],
    args = ["--errors-only"],
    require_serial = true,
    additional_dependencies = ["pylint>=3.0.0"]
  }
]
